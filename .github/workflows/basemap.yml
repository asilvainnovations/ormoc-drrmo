name: Build City basemap

# City-hosted OSM basemap for the Geo-COP map (ADR-015). Re-runs monthly and on demand.
# Optional. Needs two repository secrets (GitHub -> Settings -> Secrets and variables -> Actions ->
# New repository secret): SUPABASE_URL = the Project URL (Supabase -> Project Settings -> Data API) and
# SERVICE_ROLE_KEY = the secret key (Supabase -> Project Settings -> API Keys -> Secret keys). The key
# stays in GitHub secrets: never in the repo, never in the app. Without them the job skips.

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Protomaps daily build date (YYYYMMDD); blank = latest'
        required: false
        default: ''
  schedule:
    - cron: '0 18 1 * *' # 18:00 UTC on the 1st of each month (02:00 Manila, 2nd)

jobs:
  basemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and upload the basemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BUILD: ${{ github.event.inputs.build }}
        run: |
          if [ -z "$SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Secrets SUPABASE_URL and SERVICE_ROLE_KEY are not set: skipping. Upload the basemap by hand (DEPLOY.md, section 6)."
            exit 0
          fi
          bash scripts/build_basemap.sh
