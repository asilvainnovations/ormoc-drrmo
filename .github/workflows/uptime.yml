name: Uptime check

# Every 6 hours: confirm the public site and the Supabase project answer. Opens an
# issue (one at a time) when a check fails, and closes it when the service is back.
# Off until the City domain is live: set the repository variable UPTIME_ENABLED to true
# (Settings -> Secrets and variables -> Actions -> Variables). SITE_URL can be overridden there too.

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://www.mode-cddrmo-ormoc.online' }}
  SUPABASE_URL: https://jmctsspadywjcbbqwweh.supabase.co

jobs:
  check:
    if: vars.UPTIME_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check the public site
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/" || echo 000)
          echo "site=$code"
          [ "$code" = "200" ] || [ "$code" = "304" ]
      - name: Check the Supabase project
        run: |
          body=$(curl -sS --max-time 30 "$SUPABASE_URL/auth/v1/health" || echo '{}')
          echo "$body" | grep -q '"name"\|"api"' || echo "$body"
      - name: Open an incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'incident', per_page: 1,
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: ['incident'],
                title: `Uptime check failed — ${new Date().toISOString()}`,
                body: 'Scheduled uptime check failed. See the Actions run: ' +
                  `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
