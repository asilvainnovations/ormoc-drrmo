# Netlify deployment for the Ormoc DRRM Operations Platform.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY (or, on older projects, VITE_SUPABASE_ANON_KEY)
# in Site configuration → Environment variables.
# Without them the build runs in demo mode (data stays in the browser).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # The PWA build never needs a browser; skip Playwright's download on install.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Single-page app: any path that is not a real file opens the app shell.
# Netlify serves existing files first, so assets, sw.js and the manifest are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or devices would miss updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Hashed build files never change, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
